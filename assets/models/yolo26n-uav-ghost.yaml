# Ultralytics YOLO26 🚀 — MuraveiVision-PRO UAV Ghost variant
# Phase 1 + Phase 2: S2DConv layer 0 + FasterGhostC3k2 in neck (layers 13, 16, 19)
# Layer 22 (C3k2 with attn=True / PSABlock) is kept original — attention must not be removed.
# Weight transfer: ~82% of yolo26n.pt weights load (backbone 100%, neck ghost layers skipped)

nc: 238  # Military classes from military_classes.yaml
end2end: True
reg_max: 1
scales:
  # depth, width, max_channels — same as yolo26n
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, S2DConv, [64]]            # 0-P1/2  Space-to-Depth + PWConv (Phase 1)
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4  standard stride-2
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16
  - [-1, 2, C3k2, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]]            # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat with P4
  - [-1, 2, FasterGhostC3k2, [512, True]]        # 13 Ghost neck (was C3k2)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 cat with P3
  - [-1, 2, FasterGhostC3k2, [256, True]]        # 16 Ghost neck (was C3k2)
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18
  - [-1, 2, FasterGhostC3k2, [512, True]]        # 19 Ghost neck (was C3k2)
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21
  - [-1, 1, C3k2, [1024, True, 0.5, True]]      # 22 ORIGINAL — PSABlock attention (DO NOT REPLACE)
  - [[16, 19, 22], 1, Detect, [nc]]              # 23 P3/P4/P5 heads

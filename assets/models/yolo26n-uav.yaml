# Ultralytics YOLO26 🚀 — MuraveiVision-PRO UAV variant
# Phase 1: S2DConv replaces first Conv stride=2 for lossless small-object downsampling
# Architecture: identical to yolo26n.yaml except layer 0 (3→16 via S2D instead of stride-2 Conv)
# Weight transfer: 99.98% of yolo26n.pt weights load with strict=False (only layer 0 mismatch)

nc: 238  # Military classes from military_classes.yaml
end2end: True
reg_max: 1
scales:
  # depth, width, max_channels — same as yolo26n
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, S2DConv, [64]]            # 0-P1/2  Space-to-Depth + PWConv (replaces Conv k=3 s=2)
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4  standard stride-2
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16
  - [-1, 2, C3k2, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]]            # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat with P4
  - [-1, 2, C3k2, [512, True]]                   # 13
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 cat with P3
  - [-1, 2, C3k2, [256, True]]                   # 16
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [512, True]]                   # 19
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21
  - [-1, 1, C3k2, [1024, True, 0.5, True]]      # 22
  - [[16, 19, 22], 1, Detect, [nc]]              # 23 P3/P4/P5 heads
